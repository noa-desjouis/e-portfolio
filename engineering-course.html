<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engineering Course – E-portfolio</title>
<link rel="stylesheet" href="style.css">
<script src="data.js"></script>
<script src="app.js" defer></script>
</head>
<body>
<main>
  <h1>Engineering Course</h1>
  <p class="lead">An overview of my engineering curriculum: the modules I followed, the projects I carried out and what I produced.</p>

  <h2>My modules</h2>
  <div data-csv="courses.csv" data-render="table" data-search="off" data-cols="year|semester|course|category|credits|key_learning"></div>

  <h2>Projects</h2>
  <div data-csv="projects.csv" data-render="cards"
       data-title="project" data-subtitle="role" data-meta="period|context|team"
       data-text="description" data-tag="tools"></div>
  <h2>Project files</h2>
  <div class="links">
    <a class="btn" href="TIPE_2025_26_fr.pdf" download>TIPE presentation(French)</a>
  </div>
  <h2>Productions</h2>
</body>
</html>
